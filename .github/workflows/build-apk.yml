name: Build Android APK

on:
  push:
    branches:
      - china-native-gps-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Google services placeholders
        run: |
          cp .github/mock-google-services.json app/google-services.json
          cp .github/mock-google-services.json wear/google-services.json
          cp .github/mock-google-services.json automotive/google-services.json
      - name: Build full debug APK
        run: ./gradlew :app:assembleFullDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-cn-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
