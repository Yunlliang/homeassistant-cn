name: Build Android APK

on:
  push:
    branches:
      - china-amap-location
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      KEYSTORE_PATH: ${{ github.workspace }}/ha-cn-release.p12
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ha-cn
      KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Google services placeholders
        run: |
          cp .github/mock-google-services.json app/google-services.json
          cp .github/mock-google-services.json wear/google-services.json
          cp .github/mock-google-services.json automotive/google-services.json
      - name: Prepare persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
      - name: Update dependency locks
        run: ./gradlew :app:dependencies --write-locks
      - name: Build full debug APK
        run: ./gradlew :app:assembleFullDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-cn-amap-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
