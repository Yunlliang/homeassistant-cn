name: Sync Upstream & Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  schedule:
    # Sync daily at 20:00 UTC (04:00 Beijing Time) with official home-assistant/android
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      KEYSTORE_PATH: ${{ github.workspace }}/ha-cn-release.p12
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ha-cn
      KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync with official home-assistant/android and resolve version
        id: sync
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/home-assistant/android.git 2>/dev/null || \
            git remote set-url upstream https://github.com/home-assistant/android.git
          git fetch upstream main 'refs/tags/20*:refs/tags/20*'

          LOCAL_TAGS=$(git tag -l '20*' | sort)
          REMOTE_TAGS=$(git ls-remote --tags origin 'refs/tags/20*' | awk '!/\^\{\}$/ {sub("refs/tags/", "", $2); print $2}' | sort)
          NEW_TAGS=$(comm -23 <(printf '%s\n' "$LOCAL_TAGS") <(printf '%s\n' "$REMOTE_TAGS") | sed '/^$/d' || true)

          UPSTREAM_AHEAD=false
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            UPSTREAM_AHEAD=true
          fi

          if [ "$EVENT_NAME" = "schedule" ] && [ "$UPSTREAM_AHEAD" = "false" ] && [ -z "$NEW_TAGS" ]; then
            echo "Already up to date with official home-assistant/android; skipping scheduled build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" != "push" ] && [ "$UPSTREAM_AHEAD" = "true" ]; then
            echo "Merging new commits from official home-assistant/android:main..."
            if ! git merge --no-commit --no-ff upstream/main; then
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              NON_LOCK_CONFLICTS=$(printf '%s\n' "$CONFLICTS" | grep -v 'gradle\.lockfile$' || true)
              if [ -n "$NON_LOCK_CONFLICTS" ]; then
                echo "::error::Automatic merge conflict in: $NON_LOCK_CONFLICTS"
                git merge --abort
                exit 1
              fi
              echo "Auto-resolving gradle.lockfile conflict..."
              printf '%s\n' "$CONFLICTS" | xargs -r git checkout --theirs --
              cp .github/mock-google-services.json app/google-services.json
              cp .github/mock-google-services.json wear/google-services.json
              cp .github/mock-google-services.json automotive/google-services.json
              ./gradlew :app:dependencies --write-locks
              rm -f app/google-services.json wear/google-services.json automotive/google-services.json
              git add '*/gradle.lockfile' app/gradle.lockfile
            fi
            git diff --cached --quiet || git commit -m "Sync with upstream home-assistant/android"
            git push origin HEAD:main
          fi

          if [ -n "$NEW_TAGS" ]; then
            echo "Pushing new official release tags to origin..."
            printf '%s\n' "$NEW_TAGS" | xargs -r git push origin
          fi

          OFFICIAL_VERSION=$(git tag -l '20*' | grep -E '^20[0-9]{2}\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          COMMITS=$(git rev-list --count HEAD)
          TAGS=$(git tag | awk '!/beta/ {c++} END {print c+0}')
          VERSION_CODE=$((((COMMITS + TAGS) * 3) << 1))

          echo "Official version: $OFFICIAL_VERSION (versionCode=$VERSION_CODE)"
          echo "VERSION_NAME=$OFFICIAL_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "official_version=$OFFICIAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Google services placeholders
        if: steps.sync.outputs.should_build == 'true'
        run: |
          cp .github/mock-google-services.json app/google-services.json
          cp .github/mock-google-services.json wear/google-services.json
          cp .github/mock-google-services.json automotive/google-services.json

      - name: Prepare persistent signing key
        if: steps.sync.outputs.should_build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AMAP_API_KEY" ]; then
            echo "::error::Missing AMAP_API_KEY repository secret"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build full release APK
        if: steps.sync.outputs.should_build == 'true'
        run: ./gradlew :app:assembleFullRelease --write-locks

      - name: Upload APK artifact
        if: steps.sync.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-cn-${{ steps.sync.outputs.official_version }}-full-release-apk
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.sync.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_VERSION: ${{ steps.sync.outputs.official_version }}
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/full/release/app-full-release.apk"
          APK_NAMED="home-assistant-cn-${OFFICIAL_VERSION}-full-release.apk"
          cp "$APK_SRC" "$APK_NAMED"
          NOTES="同步官方版本 **${OFFICIAL_VERSION}**（主分支内置高德定位 + 原生 GPS 回退，正式版包名 \`io.homeassistant.companion.android\`，versionName \`${OFFICIAL_VERSION}-full\`，versionCode \`${VERSION_CODE}\`）。"
          if gh release view "$OFFICIAL_VERSION" >/dev/null 2>&1; then
            gh release upload "$OFFICIAL_VERSION" "$APK_SRC" "$APK_NAMED" --clobber
            gh release edit "$OFFICIAL_VERSION" --title "$OFFICIAL_VERSION" --notes "$NOTES"
          else
            gh release create "$OFFICIAL_VERSION" "$APK_SRC" "$APK_NAMED" --title "$OFFICIAL_VERSION" --notes "$NOTES"
          fi
